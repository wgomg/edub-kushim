app:
  environment: development
  log_level: debug

server:
  host: 0.0.0.0
  port: 3000
  read_timeout: 60
  write_timeout: 60
  idle_timeout: 60
  max_upload_size: 100 # max multipart upload size in MB

database:
  type: sqlite
  path: '~/.config/edub-kushim/data'

storage:
  consumption_dir: '~/.config/edub-kushim/inbox'
  storage_dir: '~/.config/edub-kushim/storage'

consumer:
  workers: 1
  supported_files: ['.pdf']
  delete_original: false

  textextractor:
    engine: 'mupdf' # mupdf | gopdf | pdftotext
    timeout: 120

  pdfoptimizer:
    engine: 'mupdf'
    # fallback: 'gs'  # optional: fallback optimizer if primary fails
    timeout: 120

  ocr:
    engine: 'gosseract'
    languages: [eng] # required — run 'kushim setup --languages eng,spa,...'
    # data_dir: '~/.config/edub-kushim/ocr/tessdata'
    timeout: 120

enricher:
  workers: 1

  textreducer:
    engine: 'textrank'
    timeout: 120
    target_words: 2000

  contentanalyzer:
    engine: llmopenai # llmopenai | llmanthropic | llmdeepseek | llmollama
    timeout: 120
    llm:
      openai:
        base_url: 'https://api.openai.com/v1'
        model: 'gpt-4o'
        # token: ''
      anthropic:
        base_url: 'https://api.anthropic.com/v1'
        model: 'claude-sonnet-4-5'
        # token: ''
      deepseek:
        base_url: 'https://api.deepseek.com'
        model: 'deepseek-v4-flash'
        # token: ''
      ollama:
        base_url: 'http://localhost:11434'
        model: 'llama3.2'

  tagmatcher:
    timeout: 120
    reduce_target_words: 4000
    chunk_size: 0 # 0 = use model's max_position_embeddings
    hugot:
      model: BAAI/bge-m3
      backend: GO

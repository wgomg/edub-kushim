app:
  environment: development
  log_level: debug

server:
  host: localhost
  port: 3000
  read_timeout: 60
  write_timeout: 60
  idle_timeout: 60

database:
  type: sqlite
  path: ./data

storage:
  consumption_dir: ./inbox
  storage_dir: ./storage

consumer:
  supported_files: ['.pdf']
  textextractor: 'mupdf' # mupdf | gopdf | pdftotext
  pdfoptimizer: 'mupdf'
  # optimization_fallback: 'gs'  # optional: fallback optimizer if primary fails.
  # Uses same tool names as pdfoptimizer.
  # Requires the chosen tool on PATH.
  # optimization_timeout: 120     # optional: timeout in seconds (default 30)
  ocr: 'gosseract'
  # ocr_data_dir: '~/.config/kushim/ocr/tessdata'  # optional, this is the default

# Uncomment for production
# search:
#   engine: zincsearch
#   url: http://localhost:4080
#   index: documents

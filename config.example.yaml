app:
  environment: development
  log_level: debug
  logging:
    max_size: 100      # MB per file before rotation
    max_backups: 7     # rotated files to keep
    max_age: 30        # days before deleting old backups
    compress: true     # gzip rotated files

server:
  host: 0.0.0.0
  port: 3000
  read_timeout: 60
  write_timeout: 60
  idle_timeout: 60
  max_concurrent_batches: 4 # max concurrent worker processes (enforced by the queue daemon)
  max_upload_size: 100 # max multipart upload size in MB
  max_download_files: 50 # max files in a single batch download
  max_download_size_mb: 500 # max total size in MB for batch download
  max_batch_delete: 50 # max documents in a single batch delete
  session_secret: '' # 64-char hex key for JWT signing; auto-generated if empty (logged as WARNING on startup)
  auth_enabled: false # when false, API endpoints bypass JWT auth

database:
  type: postgres
  # dsn: "postgres://edub:edub@localhost:5432/edub?sslmode=disable"
  host: localhost
  port: 5432
  user: edub
  password: edub
  database: edub
  sslmode: disable

storage:
  consumption_dir: '~/.config/edub-kushim/inbox'
  storage_dir: '~/.config/edub-kushim/storage'
  migration_mode: 'copy'  # how files relocate when storage/consumption dirs change: 'copy' (safe) or 'move' (fast)
  trash:
    retention_days: 30  # days before soft-deleted documents are permanently purged

consumer:
  workers: 1
  max_files_per_batch: 10
  supported_files: ['.pdf', '.png', '.jpg', '.jpeg', '.tiff', '.tif', '.docx', '.odt']
  polling:
    enabled: false
    interval: 5  # minutes
    # windows:                 # optional: restrict polling to specific time ranges
    #   - start: "02:00"
    #     end: "06:00"

  reclaim:
    enabled: true  # auto-resume batches interrupted by crashes or errors
    max_retries: 3
    stale_task_after: 600  # seconds

  converter:
    enabled: false
    binary: 'libreoffice'  # command name (on PATH) or full path like '/opt/libreoffice/bin/soffice'
    timeout: 300

  textextractor:
    engine: 'mupdf' # mupdf | gopdf | pdftotext
    timeout: 120     # 0 = disabled (no artificial deadline)

  pdfoptimizer:
    engine: 'mupdf'
    timeout: 0      # 0 = disabled (no artificial deadline); >0 sets a per-attempt cap in seconds
    # fallback: 'gs'  # optional: fallback optimizer if primary fails

  ocr:
    engine: 'gosseract'
    languages: [eng] # required — run 'kushim setup --languages eng,spa,...'
    # data_dir: '~/.config/edub-kushim/ocr/tessdata'
    timeout: 120    # 0 = disabled (no artificial deadline)
    # ocr_workers: 0  # parallel OCR goroutines; 0 = auto (CPU count)

  thumbnail:
    enabled: true
    engine: 'mupdf' # mupdf
    dpi: 72
    max_width: 400
    quality: 80
    timeout: 30     # 0 = disabled (no artificial deadline)
    workers: 1

enricher:
  workers: 1

  textreducer:
    engine: 'textrank'
    timeout: 120    # 0 = disabled (no artificial deadline)
    target_words: 2000

  contentanalyzer:
    enabled: false
    timeout: 120
    # prompt_template: ""  # optional custom LLM prompt; see docs for placeholders
    # doc_type_refinement:
    #   enabled: true
    #   head_words: 600
    #   tail_words: 400
    llm:
      adapter: 'openai-compatible' # openai-compatible | anthropic
      provider: 'openai'           # auto-populated from model catalog
      model: 'gpt-4o'              # auto-populated from model catalog
      # token: ''
      # temperature: 0.0
      # request_delay: 1  # seconds to sleep after each LLM request (0 = off)
    # fallbacks:              # optional ordered list of LLMs tried on provider errors
    #   - enabled: false
    #     llm:
    #       adapter: 'openai-compatible'
    #       provider: 'deepseek'
    #       model: 'deepseek-chat'
    #       token: ''
    #       temperature: 0.0
    #       request_delay: 1
    #   - enabled: false
    #     llm:
    #       adapter: 'anthropic'
    #       provider: 'anthropic'
    #       model: 'claude-sonnet-4-5'
    #       token: ''
    #       temperature: 0.0
    #       request_delay: 1

  tagmatcher:
    timeout: 120    # 0 = disabled (no artificial deadline)
    reduce_target_words: 4000
    # max tokens per inference chunk. 4096 (default) caps peak memory
    # (~2-6 GB with BGE-M3); 0 = model's max_position_embeddings (8180 for
    # BGE-M3) and can OOM small hosts. See docs/tag-matcher.md.
    chunk_size: 4096
    hugot:
      model: BAAI/bge-m3
      backend: ort

backup:
  # enabled: true
  # path: /var/backups                  # fallback directory (also used by manual CLI)
  # schedules:                          # each mode can appear at most once
  #   - mode: full                      # full: edub.sql + storage + config
  #     interval: 7                     # days between backups
  #     time: "03:00"                   # preferred time of day (HH:MM)

# Bundled PostgreSQL quickstart. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.quickstart.yml up --build
# Requires Docker Compose v2 (depends_on with service_healthy).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: edub
      POSTGRES_PASSWORD: edub
      POSTGRES_DB: edub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edub"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - edub-db-data:/var/lib/postgresql/data

  edub:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: 'postgres://edub:edub@db:5432/edub?sslmode=disable'
      ADMIN_USER: 'admin'
      ADMIN_PASSWORD: 'admin'

volumes:
  edub-db-data:

version: '2'
sql:
  - engine: 'postgresql'
    schema: 'internal/database/sql/schema/migrations'
    queries: 'internal/database/sql/queries/'
    gen:
      go:
        package: 'database'
        out: 'internal/database'
        sql_package: 'database/sql'
        inflection_exclude_table_names:
          - 'people'
          - 'document_people'
        overrides:
          - column: 'task.result'
            go_type: '*encoding/json.RawMessage'
          - column: 'task.payload'
            go_type: '*encoding/json.RawMessage'
          - column: 'task.progress'
            go_type: '*encoding/json.RawMessage'
          - db_type: 'batch_source'
            go_type:
              import: 'github.com/wgomg/edub-kushim/internal/types'
              type: 'BatchSource'
          - db_type: 'batch_status'
            go_type:
              import: 'github.com/wgomg/edub-kushim/internal/types'
              type: 'BatchStatus'
          - db_type: 'task_type'
            go_type:
              import: 'github.com/wgomg/edub-kushim/internal/types'
              type: 'TaskType'
          - db_type: 'task_status'
            go_type:
              import: 'github.com/wgomg/edub-kushim/internal/types'
              type: 'TaskStatus'
          - db_type: 'tag_verdict'
            go_type:
              import: 'github.com/wgomg/edub-kushim/internal/types'
              type: 'TagVerdict'

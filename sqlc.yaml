version: '2'
sql:
  - engine: 'postgresql'
    schema: 'internal/database/sql/schema/migrations'
    queries: 'internal/database/sql/queries/'
    gen:
      go:
        package: 'database'
        out: 'internal/database'
        sql_package: 'database/sql'
        inflection_exclude_table_names:
          - 'people'
          - 'document_people'
        overrides:
          - column: 'task.result'
            go_type: '*encoding/json.RawMessage'
          - column: 'task.payload'
            go_type: '*encoding/json.RawMessage'

version: '2'
sql:
  - engine: 'sqlite'
    schema: 'sql/schema.sql'
    queries: 'sql/queries/'
    gen:
      go:
        package: 'database'
        out: 'internal/database'
        sql_package: 'database/sql'
        overrides:
          - column: 'task.result'
            go_type: '*encoding/json.RawMessage'

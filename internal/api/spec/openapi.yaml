                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: RevokeKey clears a user's API key.
      operationId: deleteApiV1UsersByIdApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /wizard/bootstrap:
    get:
      summary: Bootstrap is the only /wizard/* route left reachable without authentication.
      description: |-
        It exists because the SPA needs to know whether auth is enabled (and which
        tools are missing) before it can decide whether to show the login screen —
        so it must expose only non-sensitive fields. Anything else (LLM tokens, DB
        connection details, full status) belongs behind GetConfig/ConfigStatus.
        Bootstrap runs the environment bootstrap and switches the wizard into
        its post-bootstrap state.
      operationId: getWizardBootstrap
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
  /wizard/config:
    get:
      summary: GetConfig serves the sanitized configuration view.
      operationId: getWizardConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
    put:
      summary: PutConfig validates and saves the submitted configuration.
      operationId: putWizardConfig
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseConfig'
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  pending_tasks:
                    type: integer
        "400":
          description: Bad Request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {}
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error:
                        type: string
                  - type: object
                    properties:
                      error: {}
            text/plain; charset=utf-8:
              schema:
                type: string
        "503":
          description: Service Unavailable
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /wizard/config/retry:
    post:
      summary: 'RetryFailedConfig retries the environment''s failed work: it resumes the batches of failed migration tasks and re-triggers asset downloads for missing or failed assets.'
      operationId: postWizardConfigRetry
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloads_started:
                    type: integer
                  retried:
                    type: integer
        "400":
          description: Bad Request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "503":
          description: Service Unavailable
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /wizard/config/status:
    get:
      summary: 'ConfigStatus serves the environment status the setup wizard polls: readiness, tool failures, pending or failed migration tasks and the direct asset downloads.'
      description: |-
        Until the database is bound—setup has not reached
        the schema step—nothing counts as configured or pending: asset downloads only start with the settings
        save, so the wizard keeps the operator on the settings step instead of polling work that was never
        started.
      operationId: getWizardConfigStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStatusResponse'
components:
  schemas:
    APIKeyStatusResponse:
      type: object
      description: |-
        APIKeyStatusResponse says whether a user has an API key and its
        non-secret metadata.
      properties:
        api_key_created_at:
          type: string
        api_key_prefix:
          type: string
        has_api_key:
          type: boolean
      required:
        - has_api_key
    AddDocumentPeopleRequest:
      type: object
      description: |-
        AddDocumentPeopleRequest attaches one person to a document with a
        role type.
      properties:
        people_id:
          type: integer
        people_type_id:
          type: integer
      required:
        - people_id
        - people_type_id
    AddDocumentTagRequest:
      type: object
      description: AddDocumentTagRequest adds one tag by id.
      properties:
        tag_id:
          type: integer
      required:
        - tag_id
    AppConfigResponse:
      type: object
      description: AppConfigResponse is the app section's API view.
      properties:
        initialized:
          type: boolean
        log_level:
          type: string
        logging:
          $ref: '#/components/schemas/LoggingConfigResponse'
      required:
        - initialized
        - log_level
        - logging
    AvailableFileType:
      type: object
      description: AvailableFileType is one ingest format the UI can offer.
      properties:
        extensions:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        label:
          type: string
        mime_type:
          type: string
        required:
          type: boolean
      required:
        - mime_type
        - label
        - extensions
        - required
    BackupConfigResponse:
      type: object
      description: BackupConfigResponse is the backup section's API view.
      properties:
        enabled:
          type: boolean
        path:
          type: string
        schedules:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/BackupScheduleResponse'
            - type: "null"
      required:
        - enabled
        - path
        - schedules
    BackupScheduleResponse:
      type: object
      description: BackupScheduleResponse is one backup schedule's API view.
      properties:
        interval:
          type: number
        keep:
          type: integer
        mode:
          type: string
        path:
          type: string
        time:
          type: string
      required:
        - mode
        - interval
        - time
        - keep
        - path
    BatchDeleteError:
      type: object
      description: BatchDeleteError is one document that could not be deleted.
      properties:
        error:
          type: string
        id:
          type: string
      required:
        - id
        - error
    BatchDeleteRequest:
      type: object
      description: BatchDeleteRequest is the bulk soft-delete request.
      properties:
        document_ids:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
      required:
        - document_ids
    BatchDeleteResult:
      type: object
      description: |-
        BatchDeleteResult reports the bulk soft delete: how many went through
        and the per-document failures.
      properties:
        deleted:
          type: integer
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BatchDeleteError'
      required:
        - deleted
    BatchDocumentTypeError:
      type: object
      description: BatchDocumentTypeError is one document whose type change failed.
      properties:
        error:
          type: string
        id:
          type: string
      required:
        - id
        - error
    BatchDocumentTypeRequest:
      type: object
      description: BatchDocumentTypeRequest sets one document type over many documents.
      properties:
        document_ids:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        document_type_id:
          type: integer
      required:
        - document_ids
        - document_type_id
    BatchDocumentTypeResult:
      type: object
      description: BatchDocumentTypeResult reports the bulk type change outcome.
      properties:
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BatchDocumentTypeError'
        updated:
          type: integer
      required:
        - updated
    BatchItem:
      type: object
      description: |-
        BatchItem is one batch as every surface shows it: identity, status, origin, schedule, the per-status
        counts, the owner's liveness and the run duration once terminal.
      properties:
        batch_id:
          type: string
        cancelled:
          type: integer
        completed:
          type: integer
        created_at:
          type: string
        discarded:
          type: integer
        duration_ms:
          type: integer
        failed:
          type: integer
        origin:
          type: string
        orphaned:
          type: boolean
        owner_pid:
          type: integer
        owner_state:
          type: string
        pending:
          type: integer
        processing:
          type: integer
        schedule:
          type: string
        status:
          type: string
        total:
          type: integer
        waiting:
          type: integer
      required:
        - batch_id
        - status
        - origin
        - total
        - waiting
        - pending
        - processing
        - completed
        - failed
        - cancelled
        - discarded
        - orphaned
    BatchTagError:
      type: object
      description: BatchTagError is one document whose tag change failed.
      properties:
        error:
          type: string
        id:
          type: string
      required:
        - id
        - error
    BatchTagRequest:
      type: object
      description: |-
        BatchTagRequest is a bulk tag change: documents, tags, and the mode
        (add or remove).
      properties:
        document_ids:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        mode:
          type: string
        tag_ids:
          anyOf:
            - type: array
              items:
                type: integer
            - type: "null"
      required:
        - document_ids
        - tag_ids
        - mode
    BatchTagResult:
      type: object
      description: BatchTagResult reports the bulk tag change outcome.
      properties:
        assigned:
          type: integer
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BatchTagError'
      required:
        - assigned
    BootstrapResponse:
      type: object
      description: |-
        BootstrapResponse reports the bootstrap outcome: whether the server
        now authenticates and which tools are still missing.
      properties:
        auth_enabled:
          type: boolean
        missing_tools:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExternalTool'
            - type: "null"
      required:
        - auth_enabled
        - missing_tools
    Catalog:
      type: object
      description: |-
        Catalog is the full editable catalog: every provider, including the ones with no models, and every
        model entry, both ordered by name.
      properties:
        models:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ModelInput'
            - type: "null"
        providers:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ProviderInput'
            - type: "null"
      required:
        - providers
        - models
    CompanionTool:
      type: object
      description: |-
        CompanionTool is a binary an engine wraps (ocrmypdf needs tesseract
        and unpaper): whether it is present and whether its absence blocks the
        engine.
      properties:
        available:
          type: boolean
        command:
          type: string
        install_hints:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        purpose:
          type: string
        required:
          type: boolean
      required:
        - command
        - purpose
        - available
        - required
        - install_hints
    ConfigResponse:
      type: object
      description: |-
        ConfigResponse is the full configuration as the API shows it: every
        section view plus the engines and file types the UI offers.
      properties:
        app:
          $ref: '#/components/schemas/AppConfigResponse'
        available_engines:
          anyOf:
            - type: object
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/EngineEntry'
            - type: "null"
        available_file_types:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/AvailableFileType'
            - type: "null"
        backup:
          $ref: '#/components/schemas/BackupConfigResponse'
        consumer:
          $ref: '#/components/schemas/ConsumerConfigResponse'
        database:
          $ref: '#/components/schemas/DatabaseConfigResponse'
        enricher:
          $ref: '#/components/schemas/EnricherConfigResponse'
        mirror:
          $ref: '#/components/schemas/MirrorConfigResponse'
        server:
          $ref: '#/components/schemas/ServerConfigResponse'
        storage:
          $ref: '#/components/schemas/StorageConfigResponse'
      required:
        - app
        - server
        - storage
        - database
        - consumer
        - enricher
        - backup
        - mirror
        - available_engines
        - available_file_types
    ConfigStatusResponse:
      type: object
      description: ConfigStatusResponse is the environment status the wizard polls.
      properties:
        configured:
          type: boolean
        errors:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        failed_tasks:
          type: array
          items:
            $ref: '#/components/schemas/FailedTaskSummary'
        missing_tools:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExternalTool'
            - type: "null"
        pending_tasks:
          type: integer
        tools:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExternalTool'
            - type: "null"
      required:
        - configured
        - pending_tasks
        - errors
        - tools
        - missing_tools
    ConsumerConfigResponse:
      type: object
      description: ConsumerConfigResponse is the consumer section's API view.
      properties:
        converter:
          $ref: '#/components/schemas/DocxOdtConverterResponse'
        max_files_per_batch:
          type: integer
        ocr:
          $ref: '#/components/schemas/OCRResponse'
        pdfoptimizer:
          $ref: '#/components/schemas/PdfOptimizerResponse'
        polling:
          $ref: '#/components/schemas/PollingConfigResponse'
        reclaim:
          $ref: '#/components/schemas/ReclaimConfigResponse'
        supported_files:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        textextractor:
          $ref: '#/components/schemas/TextExtractorResponse'
        thumbnail:
          $ref: '#/components/schemas/ThumbnailConfigResponse'
        workers:
          type: integer
      required:
        - supported_files
        - workers
        - max_files_per_batch
        - converter
        - textextractor
        - pdfoptimizer
        - ocr
        - thumbnail
        - polling
        - reclaim
    ContentAnalyzerResponse:
      type: object
      description: ContentAnalyzerResponse is the analyzer section's API view.
      properties:
        doc_type_refinement:
          $ref: '#/components/schemas/DocTypeRefinementResponse'
        enabled:
          type: boolean
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/FallbackConfigResponse'
        llm:
          $ref: '#/components/schemas/LlmConfigResponse'
        min_tags:
          type: integer
        pause_on_credit_error:
          type: boolean
        prompt_template:
          type: string
        timeout:
          type: integer
      required:
        - enabled
        - timeout
        - min_tags
        - llm
        - doc_type_refinement
        - pause_on_credit_error
    CoverageFlagActionRequest:
      type: object
      description: CoverageFlagActionRequest is the body of the coverage flag apply and dismiss actions.
      properties:
        document_id:
          type: integer
        tag_name:
          type: string
      required:
        - document_id
        - tag_name
    CoverageFlagListResponse:
      type: object
      description: CoverageFlagListResponse is one page of open coverage flags.
      properties:
        results:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/CoverageFlagResponse'
            - type: "null"
        total:
          type: integer
      required:
        - results
        - total
    CoverageFlagResponse:
      type: object
      description: CoverageFlagResponse is one open coverage flag as the API shows it.
      properties:
        class:
          type: string
        created_at:
          type: string
          format: date-time
        document_id:
          type: integer
        document_title:
          type: string
        id:
          type: integer
        provisional:
          type: boolean
        source:
          type: string
        tag_name:
          type: string
      required:
        - id
        - document_id
        - document_title
        - tag_name
        - class
        - source
        - provisional
        - created_at
    CreateAPIKeyResponse:
      type: object
      description: |-
        CreateAPIKeyResponse returns the freshly minted API key, which the
        client must store because only its hash is kept server-side.
      properties:
        api_key:
          type: string
        message:
          type: string
        prefix:
          type: string
      required:
        - api_key
        - prefix
        - message
    CreateAuditValueRequest:
      type: object
      description: |-
        CreateAuditValueRequest is the body of the coverage create-value action: it names the missing dimension to
        register and carries no document, since the value is a vocabulary addition.
      properties:
        tag_name:
          type: string
      required:
        - tag_name
    CreateDocumentTypeRequest:
      type: object
      description: CreateDocumentTypeRequest is the body of a document type create.
      properties:
        description:
          type: string
        name:
          type: string
      required:
        - name
        - description
    CreatePeopleTypeRequest:
      type: object
      description: CreatePeopleTypeRequest is the body of a people type create.
      properties:
        description:
          type: string
        name:
          type: string
      required:
        - name
        - description
    CreatePersonRequest:
      type: object
      description: |-
        CreatePersonRequest is the body of a person create: romanized name and
        the optional native-script name.
      properties:
        name:
          type: string
        name_native:
          type: string
      required:
        - name
        - name_native
    CreateSavedSearchRequest:
      type: object
      description: |-
        CreateSavedSearchRequest is the body of a saved-search create: a name
        and the structured filter as raw JSON.
      properties:
        filter:
          description: Arbitrary JSON, copied verbatim (encoding/json.RawMessage).

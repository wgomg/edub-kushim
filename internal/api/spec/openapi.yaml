          type: string
      required:
        - name
        - filter
    CreateTagRequest:
      type: object
      description: CreateTagRequest is the body of POST /api/v1/tags.
      properties:
        name:
          type: string
      required:
        - name
    CreateUserRequest:
      type: object
      description: |-
        CreateUserRequest is the body of POST /api/v1/users; an empty role
        defaults to viewer.
      properties:
        password:
          type: string
        role:
          type: string
        username:
          type: string
      required:
        - username
        - password
    DashboardResponse:
      type: object
      description: DashboardResponse is everything the dashboard needs in one payload.
      properties:
        analytics:
          $ref: '#/components/schemas/DocumentAnalytics'
        avg_file_size_bytes:
          type: integer
        cancelled:
          type: integer
        completed:
          type: integer
        discarded:
          type: integer
        failed:
          type: integer
        inbox_files:
          type: integer
        original_type_breakdown:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/OriginalTypeStat'
            - type: "null"
        originals_size_bytes:
          type: integer
        pending:
          type: integer
        processed_size_bytes:
          type: integer
        processing:
          type: integer
        processing_health:
          $ref: '#/components/schemas/ProcessingHealth'
        recent_batches:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/BatchItem'
            - type: "null"
        running_tasks:
          $ref: '#/components/schemas/RunningTasksResponse'
        storage_trend:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/StorageTrendPoint'
            - type: "null"
        total_batches:
          type: integer
        total_files:
          type: integer
        total_pages:
          type: integer
        total_words:
          type: integer
        waiting:
          type: integer
      required:
        - recent_batches
        - running_tasks
        - total_batches
        - total_files
        - inbox_files
        - waiting
        - pending
        - processing
        - completed
        - failed
        - cancelled
        - discarded
        - originals_size_bytes
        - processed_size_bytes
        - original_type_breakdown
        - storage_trend
        - avg_file_size_bytes
        - total_pages
        - total_words
    DatabaseConfig:
      type: object
      description: |-
        DatabaseConfig is the PostgreSQL section: a discrete connection or a
        full DSN, the container runtime used by the database-backed tests, and
        the idempotent seeders to apply.
      properties:
        container:
          type: string
        database:
          type: string
        dsn:
          type: string
        host:
          type: string
        password:
          type: string
        port:
          type: integer
        runtime:
          type: string
        seeders:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        sslmode:
          type: string
        user:
          type: string
      required:
        - host
        - port
        - user
        - password
        - database
        - sslmode
        - dsn
        - runtime
        - container
        - seeders
    DatabaseConfigResponse:
      type: object
      description: |-
        DatabaseConfigResponse is the database section's API view, without the
        password.
      properties:
        container:
          type: string
        database:
          type: string
        host:
          type: string
        port:
          type: integer
        runtime:
          type: string
        sslmode:
          type: string
        user:
          type: string
      required:
        - host
        - port
        - user
        - database
        - sslmode
        - runtime
        - container
    DateRange:
      type: object
      description: DateRange is one date bound pair, each side optional.
      properties:
        from:
          anyOf:
            - type: string
            - type: "null"
        to:
          anyOf:
            - type: string
            - type: "null"
      required:
        - from
        - to
    DeletedTagListResponse:
      type: object
      description: DeletedTagListResponse is one page of deleted-tag records.
      properties:
        results:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/DeletedTagResponse'
            - type: "null"
        total:
          type: integer
      required:
        - results
        - total
    DeletedTagResponse:
      type: object
      description: |-
        DeletedTagResponse is one deleted-tag record as the API shows it: the name, its kind (an operator
        block), and when.
      properties:
        deleted_at:
          type: string
          format: date-time
        kind:
          type: string
        name:
          type: string
      required:
        - name
        - kind
        - deleted_at
    DistributionItem:
      type: object
      description: DistributionItem is one labeled bucket of a distribution chart.
      properties:
        count:
          type: integer
        label:
          type: string
      required:
        - label
        - count
    DocTypeRefinementResponse:
      type: object
      description: DocTypeRefinementResponse is the type-refinement section's API view.
      properties:
        enabled:
          type: boolean
        head_words:
          type: integer
        tail_words:
          type: integer
      required:
        - enabled
        - head_words
        - tail_words
    DocumentAnalytics:
      type: object
      description: |-
        DocumentAnalytics is the dashboard's document analytics: language,
        type and tag distributions plus the missing-state counts.
      properties:
        document_type_distribution:
          anyOf:

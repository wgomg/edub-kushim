openapi: 3.1.1
info:
  title: edub API
  description: |
    REST API of the edub document server: library browsing, search, tags, people,
    document types, trash, ingestion, task and batch monitoring, users, logs and
    the settings surface the web UI drives.
  version: 4.0.2
  contact:
    name: edub-kushim
    url: https://github.com/wgomg/edub-kushim
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:3000
    description: Local edub server (default port; server.port in the config)
paths:
  /api/v1/auth/login:
    post:
      summary: Login verifies the credentials and sets the session cookie.
      operationId: postApiV1AuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
        "400":
          description: Bad Request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/auth/logout:
    post:
      summary: Logout clears the session cookie.
      operationId: postApiV1AuthLogout
      responses:
        "204":
          description: No Content
  /api/v1/batches:
    get:
      summary: ListBatches serves one page of batch overviews, optionally filtered by batch status and by the presence of at least one task in a given task status; an invalid task_status is a client error.
      operationId: getApiV1Batches
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: ""
        - name: task_status
          in: query
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          schema:
            type: integer
            default: "20"
        - name: offset
          in: query
          schema:
            type: integer
            default: "0"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBatchesResponse'
        "400":
          description: Bad Request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/batches/{id}:
    get:
      summary: GetBatchSummary serves one batch's aggregate row.
      operationId: getApiV1BatchesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchItem'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/batches/{id}/cancel:
    post:
      summary: 'CancelBatch cancels a batch through the single cancel operation: pending, waiting and processing tasks cancel, a live executor is signalled, and the lease and locks are released.'
      operationId: postApiV1BatchesByIdCancel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  cancelled_pending:
                    type: integer
                  cancelled_processing:
                    type: integer
                  signal_sent:
                    type: boolean
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        default:
          description: Status code could not be determined
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/batches/{id}/resume:
    post:
      summary: ResumeBatch requeues a settled or paused batch, optionally retrying its failed tasks; the retry intent is the retry_failed query parameter.
      operationId: postApiV1BatchesByIdResume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: retry_failed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                  reset:
                    type: integer
                  resumed:
                    type: boolean
                  retried:
                    type: integer
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: integer
                  resumed:
                    type: boolean
                  retried:
                    type: integer
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "503":
          description: Service Unavailable
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        default:
          description: Status code could not be determined
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/consume:
    post:
      summary: 'Consume scans the consumption directory and enqueues one batch: one consume task per new file with its waiting enrich (and thumbnail) children, deduplicating by MD5 content.'
      description: |-
        Unprocessable when the
        required tools are missing; an empty inbox reports no batch.
      operationId: postApiV1Consume
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: "null"
                  message:
                    type: string
                  total_files:
                    type: integer
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  _links:
                    type: object
                    additionalProperties:
                      type: string
                  batch_id:
                    type: string
                  enqueued:
                    type: integer
                  total_files:
                    type: integer
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  missing_tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalTool'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/consume/upload:
    post:
      summary: Upload writes an uploaded file into the consumption directory and returns its served name.
      operationId: postApiV1ConsumeUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  _links:
                    type: object
                    additionalProperties:
                      type: string
                  accepted:
                    type: integer
                  batch_id:
                    type: string
                  rejected:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: object
        "400":
          description: Bad Request
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "413":
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  missing_tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalTool'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/dashboard:
    get:
      summary: 'GetDashboard serves the dashboard: recent batches, running tasks, analytics, processing health and storage usage.'
      operationId: getApiV1Dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/v1/document-types:
    get:
      summary: List serves the paged document types with document counts.
      operationId: getApiV1DocumentTypes
      parameters:
        - name: q
          in: query
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          schema:
            type: integer
            default: "50"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentTypeResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    post:
      summary: Create creates one document type from the JSON body.
      operationId: postApiV1DocumentTypes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentTypeRequest'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                  id:
                    type: integer
                  name:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/document-types/{id}:
    put:
      summary: Update renames one document type.
      operationId: putApiV1DocumentTypesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentTypeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                  id:
                    type: integer
                  name:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: Delete removes one document type.
      operationId: deleteApiV1DocumentTypesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents:
    get:
      summary: ListDocuments serves the paged document listing.
      operationId: getApiV1Documents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: "50"
        - name: offset
          in: query
          schema:
            type: integer
            default: "0"
        - name: sort_by
          in: query
          schema:
            type: string
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            default: desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/{id}:
    get:
      summary: GetDocument serves one document's full view.
      operationId: getApiV1DocumentsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    put:
      summary: UpdateDocument updates a document's title, type, language and optional corrected text.
      operationId: putApiV1DocumentsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdateRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: DeleteDocument soft-deletes one document into the trash.
      operationId: deleteApiV1DocumentsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/{id}/file:
    get:
      summary: GetDocumentFile streams the stored file with its content type.
      operationId: getApiV1DocumentsByIdFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/{id}/people:
    post:
      summary: AddDocumentPeople attaches one person to a document with a role.
      operationId: postApiV1DocumentsByIdPeople
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentPeopleRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: RemoveDocumentPeople detaches one person role from a document.
      operationId: deleteApiV1DocumentsByIdPeople
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDocumentPeopleRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/{id}/reenrich:
    post:
      summary: ReEnrich enqueues one document's re-enrichment.
      operationId: postApiV1DocumentsByIdReenrich
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  _links:
                    type: object
                    additionalProperties:
                      type: string
                  batch_id:
                    type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/{id}/tags:
    post:
      summary: AddDocumentTag attaches one tag to a document.
      operationId: postApiV1DocumentsByIdTags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentTagRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
    delete:
      summary: RemoveDocumentTag detaches one tag from a document.
      operationId: deleteApiV1DocumentsByIdTags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDocumentTagRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/{id}/thumbnail:
    get:
      summary: GetDocumentThumbnail serves the document's thumbnail, 404 when there is none.
      operationId: getApiV1DocumentsByIdThumbnail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal Server Error
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
  /api/v1/documents/batch-delete:
    post:
      summary: BatchDeleteDocuments soft-deletes many documents at once, reporting per-document failures.
      operationId: postApiV1DocumentsBatchDelete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                  - type: object

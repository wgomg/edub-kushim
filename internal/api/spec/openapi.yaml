      description: TagAdjudicatorLlmResponse is one LLM endpoint of the judged steps.
      properties:
        adapter:
          type: string
        model:
          type: string
        provider:
          type: string
        request_delay:
          type: number
        token:
          type: string
      required:
        - adapter
        - provider
        - model
        - request_delay
    TagAuditConfigResponse:
      type: object
      description: TagAuditConfigResponse is the coverage audit section's API view.
      properties:
        enabled:
          type: boolean
        interval:
          type: number
        sample_size:
          type: integer
        time:
          type: string
      required:
        - enabled
        - interval
        - time
        - sample_size
    TagListResponse:
      type: object
      description: TagListResponse is one page of the tag listing.
      properties:
        results:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/TagResponse'
            - type: "null"
        total:
          type: integer
      required:
        - results
        - total
    TagMaintenanceConfigResponse:
      type: object
      description: TagMaintenanceConfigResponse is the maintenance routine section's API view.
      properties:
        enabled:
          type: boolean
        interval:
          type: number
        time:
          type: string
      required:
        - enabled
        - interval
        - time
    TagMatcherResponse:
      type: object
      description: TagMatcherResponse is the matcher section's API view.
      properties:
        chunk_size:
          type: integer
        hugot:
          $ref: '#/components/schemas/HugotResponse'
        reduce_target_words:
          type: integer
        timeout:
          type: integer
        top_n:
          type: integer
      required:
        - timeout
        - reduce_target_words
        - chunk_size
        - top_n
        - hugot
    TagMeasureConfigResponse:
      type: object
      description: TagMeasureConfigResponse is the measure section's API view.
      properties:
        after_enrichment_batch:
          type: boolean
        enabled:
          type: boolean
        interval:
          type: number
        time:
          type: string
      required:
        - enabled
        - interval
        - time
        - after_enrichment_batch
    TagQualityConfigResponse:
      type: object
      description: TagQualityConfigResponse is the quality judge's API view.
      properties:
        enabled:
          type: boolean
        llm:
          $ref: '#/components/schemas/TagAdjudicatorLlmResponse'
        timeout:
          type: integer
      required:
        - enabled
        - timeout
        - llm
    TagQualityCriteriaView:
      type: object
      description: |-
        TagQualityCriteriaView is the API view of the judge's rubric answers;
        a nil answer had no signal in the stored payload.
      properties:
        atomic:
          anyOf:
            - type: boolean
            - type: "null"
        defer:
          anyOf:
            - type: boolean
            - type: "null"
        dimension:
          anyOf:
            - type: boolean
            - type: "null"
        not_form_genre:
          anyOf:
            - type: boolean
            - type: "null"
        not_person:
          anyOf:
            - type: boolean
            - type: "null"
        subject_matter:
          anyOf:
            - type: boolean
            - type: "null"
      required:
        - subject_matter
        - dimension
        - not_person
        - atomic
        - not_form_genre
        - defer
    TagQualityVerdictInfo:
      type: object
      description: |-
        TagQualityVerdictInfo is the latest recorded quality verdict for a
        provisional tag: the pass flag, the recorded outcome (absent on rows
        predating the outcome column), its criteria (nil when unjudged) and the
        model.
      properties:
        criteria:
          anyOf:
            - $ref: '#/components/schemas/TagQualityCriteriaView'
            - type: "null"
        model:
          type: string
        outcome:
          type: string
        pass:
          type: boolean
        verdict_at:
          type: string
          format: date-time
      required:
        - pass
        - criteria
        - verdict_at
    TagReconcileConfigResponse:
      type: object
      description: TagReconcileConfigResponse is the reconcile section's API view.
      properties:
        dead_tag_grace_days:
          type: integer
        enabled:
          type: boolean
        interval:
          type: number
        max_rejudge:
          type: integer
        max_retag:
          type: integer
        provisional_grace_days:
          type: integer
        report_only:
          type: boolean
        time:
          type: string
      required:
        - enabled
        - report_only
        - interval
        - time
        - max_rejudge
        - max_retag
        - dead_tag_grace_days
        - provisional_grace_days
    TagReconcileReportResponse:
      type: object
      description: |-
        TagReconcileReportResponse points at the task whose result holds the
        reconcile report.
      properties:
        completed_at:
          type: string
        result:
          description: Arbitrary JSON, copied verbatim (encoding/json.RawMessage).
        task_id:
          type: string
      required:
        - task_id
        - completed_at
        - result
    TagResponse:
      type: object
      description: |-
        TagResponse carries a tag on the vocabulary and document surfaces: the vocabulary listing fills both
        DocumentCount — every assignment, trashed documents included — and Promoted, while Seeded marks the
        operator-owned inventory the demote action must leave alone.
      properties:
        document_count:
          type: integer
        id:
          type: integer
        name:
          type: string
        promoted:
          type: boolean
        seeded:
          type: boolean
      required:
        - id
        - name
        - document_count
        - promoted
        - seeded
    TaskProgressResponse:
      type: object
      description: TaskProgressResponse is the persisted progress snapshot of a task.
      properties:
        detail:
          type: string
        pct:
          type: number
        step:
          type: string
        updated_at:
          type: string
      required:
        - step
        - updated_at
    TaskResponse:
      type: object
      description: |-
        TaskResponse is one task as the API shows it: identity, status, the
        payload's file name and document id, the label, the progress snapshot,
        and the result once done.
      properties:
        batch_id:
          type: string
        completed_at:
          anyOf:
            - type: string
            - type: "null"
        created_at:
          type: string
        error:
          anyOf:
            - type: string
            - type: "null"
        file_name:
          type: string
        label:
          type: string
        payload_doc_id:
          type: string
        progress:
          $ref: '#/components/schemas/TaskProgressResponse'
        result:
          description: Arbitrary JSON, copied verbatim (encoding/json.RawMessage).
        started_at:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
        task_id:
          type: string
        task_type:
          type: string
      required:
        - task_id
        - batch_id
        - task_type
        - file_name
        - payload_doc_id
        - status
        - error
        - label
        - created_at
        - started_at
        - completed_at
    TextExtractorResponse:
      type: object
      description: TextExtractorResponse is the extractor section's API view.
      properties:
        engine:
          type: string
        timeout:
          type: integer
      required:
        - engine
        - timeout
    TextReducerResponse:
      type: object
      description: TextReducerResponse is the reducer section's API view.
      properties:
        engine:
          type: string
        target_words:
          type: integer
        timeout:
          type: integer
      required:
        - engine
        - timeout
        - target_words
    ThumbnailConfigResponse:
      type: object
      description: ThumbnailConfigResponse is the thumbnail section's API view.
      properties:
        backfill_interval:
          type: number
        backfill_time:
          type: string
        dpi:
          type: integer
        enabled:
          type: boolean
        engine:
          type: string
        max_width:
          type: integer
        quality:
          type: integer
        timeout:
          type: integer
        workers:
          type: integer
      required:
        - enabled
        - engine
        - dpi
        - max_width
        - quality
        - timeout
        - workers
        - backfill_interval
        - backfill_time
    TrashConfigResponse:
      type: object
      description: TrashConfigResponse is the trash section's API view.
      properties:
        retention_days:
          type: integer
      required:
        - retention_days
    TrashDocumentResponse:
      type: object
      description: TrashDocumentResponse is one trashed document as the API shows it.
      properties:
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        document_id:
          type: string
        file_size:
          type: integer
        id:
          type: integer
        language:
          type: string
        original_type:
          type: string
        page_count:
          type: integer
        title:
          type: string
      required:
        - id
        - document_id
        - title
        - original_type
        - file_size
        - page_count
        - language
        - deleted_at
        - created_at
    TrashListResponse:
      type: object
      description: TrashListResponse is one page of the trash listing.
      properties:
        documents:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/TrashDocumentResponse'
            - type: "null"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
        - documents
        - total
        - limit
        - offset
    TrashRestoreResponse:
      type: object
      description: TrashRestoreResponse reports a bulk trash restore.
      properties:
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BatchDeleteError'
        restored:
          type: integer
      required:
        - restored
    UpdateDocumentTypeRequest:
      type: object
      description: UpdateDocumentTypeRequest is the body of a document type update.
      properties:
        description:
          type: string
        name:
          type: string
      required:
        - name
        - description
    UpdatePeopleTypeRequest:
      type: object
      description: UpdatePeopleTypeRequest is the body of a people type update.
      properties:
        description:
          type: string
        name:
          type: string
      required:
        - name
        - description
    UpdatePersonRequest:
      type: object
      description: UpdatePersonRequest is the body of a person update.
      properties:
        name:
          type: string
        name_native:
          type: string
      required:
        - name
        - name_native
    UpdateTagRequest:
      type: object
      description: UpdateTagRequest is the body of a tag rename.
      properties:
        name:
          type: string
      required:
        - name
    UpdateUserRequest:
      type: object
      description: |-
        UpdateUserRequest is the body of a user update; an empty password
        keeps the current one.
      properties:
        password:
          type: string
        role:
          type: string
        username:
          type: string
      required:
        - username
    UserListResponse:
      type: object
      description: UserListResponse is one page of users.
      properties:
        total:
          type: integer
        users:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/UserResponse'
            - type: "null"
      required:
        - users
        - total
    UserResponse:
      type: object
      description: |-
        UserResponse is a user as the API shows it: no hash, but the API key's
        existence, prefix and creation time.
      properties:
        api_key_created_at:
          type: string
        api_key_prefix:
          type: string
        created_at:
          type: string
        has_api_key:
          type: boolean
        id:
          type: integer
        role:
          type: string
        username:
          type: string
      required:
        - id
        - username
        - role
        - created_at
        - has_api_key
    loginRequest:
      type: object
      properties:
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
    loginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - token
        - user
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: Authorization
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
  - apiKeyAuth: []
